# Unix/Linux Demo Configuration File
# This file demonstrates various configuration patterns

[server]
hostname = web-server
port = 80
max_connections = 1000
timeout = 30

[database]
host = db-server
port = 3306
username = demouser
password = demo123
database = demoapp
pool_size = 10

[logging]
level = INFO
file = /var/log/demo.log
max_size = 100MB
rotate = true
retain_days = 7

[security]
ssl_enabled = true
cert_file = /etc/ssl/certs/demo.crt
key_file = /etc/ssl/private/demo.key
allowed_hosts = localhost,web-server,*.demo.local

[cache]
type = redis
host = cache-server
port = 6379
timeout = 5
max_memory = 256MB

# Environment-specific settings
[development]
debug = true
log_level = DEBUG
auto_reload = true

[production]
debug = false
log_level = WARNING
auto_reload = false
monitoring = true

# Feature flags
[features]
new_ui = enabled
advanced_search = disabled
analytics = enabled
beta_features = disabled

# Network settings
[network]
bind_address = 0.0.0.0
proxy_timeout = 60
keepalive = true
compression = gzip

# Backup configuration
[backup]
enabled = true
schedule = "0 2 * * *"  # Daily at 2 AM
destination = /demo/backup
retention = 30  # days
compression = true

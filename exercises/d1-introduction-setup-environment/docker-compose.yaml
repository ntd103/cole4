services:
  cat-analyzer:
    build: .
    container_name: cat_fact_analyzer
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data  # Optional: persist data
    restart: unless-stopped
    networks:
      - cat_network

  # Optional: Add a simple web interface (bonus!)
  cat-web:
    build: 
      context: .
      dockerfile: Dockerfile.web
    container_name: cat_web_interface
    ports:
      - "8080:8080"
    depends_on:
      - cat-analyzer
    networks:
      - cat_network
    environment:
      - FLASK_ENV=development

networks:
  cat_network:
    driver: bridge

volumes:
  cat_data:
    driver: local